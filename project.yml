name: Harbor
options:
  bundleIdPrefix: com.appamore
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: ios/Harbor
    info:
      path: ios/Harbor/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Harbor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Harbor uses your location only when you choose to share it with a circle.
        NSLocationAlwaysAndWhenInUseUsageDescription: Harbor uses background location to keep an active sharing session updated after you leave the app.
        UIBackgroundModes:
          - location
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appamore.harbor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - HarborTests
  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/HarborTests
    dependencies:
      - target: Harbor
