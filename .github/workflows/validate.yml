name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: ios-build
        shell: bash
        run: |
          mkdir -p build-diagnostics
          set +e
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/harbor-xcodebuild.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "Xcode build failed. Relevant diagnostics:"
              grep -n -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|The following build commands failed' /tmp/harbor-xcodebuild.log | tail -160 || true
              echo
              echo "Last 120 lines:"
              tail -120 /tmp/harbor-xcodebuild.log
            } > build-diagnostics/ios-build-errors.txt
            cat build-diagnostics/ios-build-errors.txt
            exit "$status"
          fi
          echo "Xcode build succeeded."
      - name: Upload iOS failure diagnostics
        if: failure() && steps.ios-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: build-diagnostics/ios-build-errors.txt
          if-no-files-found: error
          retention-days: 7
